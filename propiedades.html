<!DOCTYPE html>

    <div class="container">
      <a class="navbar-brand mx-auto d-flex justify-content-center" href="index.html">
        <img src="img/logo_integrado.png" alt="PewmaGrid Logo" style="height:70px;" onerror="this.onerror=null; this.src='img/no-image.png';">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>

      </div>
    </div>

    <div class="container text-center">
      <h1 class="fw-bold">Propiedades</h1>

      <select class="form-select w-auto"><option selected>Tipo</option></select>
      <select class="form-select w-auto"><option selected>Ubicación</option></select>

      <button class="btn btn-primary">Filtrar</button>

          <a href="#" class="text-white">LinkedIn</a>

      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function(){
      document.querySelectorAll("img").forEach(function(img){
        img.onerror = function(){
          this.onerror = null;
          this.src = "img/no-image.png";
        };
      });
    });
